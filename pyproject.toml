[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epr"
version = "0.1.0"
description = "Household electricity-to-gas price ratio for Europe and Great Britain, built from Eurostat, DESNZ and ECB data"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2",
  "openpyxl>=3.1",
  "matplotlib>=3.8",
  "requests>=2.31",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
