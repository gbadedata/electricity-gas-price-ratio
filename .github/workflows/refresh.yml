name: Refresh data

# Pulls every source, checks it, rebuilds the published dataset and commits
# the result. Runs weekly (Eurostat publishes household prices twice a year,
# DESNZ quarterly) and on demand.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Fetch sources
        run: python -m epr fetch

      - name: Build and validate (only when a source changed)
        run: |
          if git diff --quiet -- data/raw; then
            echo "Sources unchanged; published outputs left as they are."
          else
            python -m epr build
          fi

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if [ -d reports ]; then git add -A reports; fi
          if git diff --cached --quiet; then
            echo "No changes in sources or outputs."
          else
            git commit -m "Refresh data: $(date -u +%Y-%m-%d)"
            git push
          fi
